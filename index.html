<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1f3d2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #e8f5e9;
        }

        #canvas {
            border: 4px solid #558b2f;
            box-shadow: 
                0 0 20px rgba(139, 195, 74, 0.5),
                inset 0 0 10px rgba(0, 0, 0, 0.3);
            padding-left: 0;
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            background: linear-gradient(to bottom, #87ceeb 0%, #90ee90 50%, #8b7355 100%);
            max-width: 100%;
            height: auto;
        }

        /* Estilos para elementos de UI (se adicionar depois) */
        button {
            background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
            border: 2px solid #558b2f;
            color: #e8f5e9;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #388e3c 0%, #43a047 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Estilos para painéis de informação */
        .info-panel {
            background: rgba(27, 94, 32, 0.9);
            border: 2px solid #558b2f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #c8e6c9;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-size: 14px;
        }

        .info-panel h3 {
            color: #8bc34a;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Estilos para input */
        input {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #558b2f;
            color: #e8f5e9;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            background: rgba(76, 175, 80, 0.3);
            box-shadow: 0 0 8px rgba(139, 195, 74, 0.5);
        }

        /* Scrollbar estilizado */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(27, 94, 32, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #558b2f;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8bc34a;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            color: #8bc34a;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(139, 195, 74, 0.6);
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 
                    2px 2px 4px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(139, 195, 74, 0.6);
            }
            50% {
                text-shadow: 
                    2px 2px 4px rgba(0, 0, 0, 0.5),
                    0 0 30px rgba(139, 195, 74, 0.9);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Evolução em Ação</h1>
        <canvas id="canvas" width="1200" height="800"></canvas>
    </div>
    <script src="img.js"></script>
    <script src="vetores.js"></script>
    <script src="func.js"></script>
    <script src="index.js"></script>
</body>
</html>
